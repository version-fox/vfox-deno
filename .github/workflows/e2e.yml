name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces the run of the push before it. Every
  # commit on main gets a group of its own, so a newer commit never cancels the
  # run of an older one. See docs/development.md.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The suite runs natively on each runner: the harness downloads the pinned vfox
# itself (tests/e2e/vfox.go) and drives it with an isolated VFOX_HOME, so no
# container is needed. The arm64 runners cover Deno's arm64 builds.
jobs:
  e2e:
    if: github.repository == 'version-fox/vfox-deno'
    name: E2E (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-26.04-arm, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Run the end-to-end suite
        run: go test -v -timeout 55m -run TestE2E ./...
        working-directory: tests/e2e
